# Demo local de punta a punta:  docker compose up
#
#   APIs simuladas ──► k6 (producción, A, B en secuencia) ──► perf-gate ──► reportes + Grafana
#
#   Grafana:  http://localhost:3000   (sin login, dashboard ya cargado)
#   Reportes: http://localhost:8000   (HTML de cada versión + grafana.json)
#
# Variables opcionales (archivo .env o entorno): DURATION, VUS, PERF_GATE_REF.

x-api: &api
  image: python:3.12-slim
  command: ["python", "/app/mock_api.py"]
  volumes:
    - ./local/api:/app:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
    interval: 2s
    timeout: 2s
    retries: 15

x-k6: &k6
  image: grafana/k6:2.2.0
  user: "0"   # escribir resultados en la carpeta montada
  volumes:
    - ./local/k6:/scripts:ro
    - ./local/output/results:/results

services:
  # ------------------------------------------------------------ aplicaciones bajo prueba
  api-produccion:
    <<: *api
  api-version-a:          # pagos ~2,2x más lento y con errores (como la versión A del kit)
    <<: *api
    environment:
      PAGOS_FACTOR: "2.2"
      PAGOS_ERROR_PCT: "3"
  api-version-b:          # igual a producción, pero con arranque en frío (como la versión B del kit)
    <<: *api
    environment:
      COLD_START_S: "25"
      COLD_FACTOR: "3"

  # ------------------------------------------------------------ pruebas de carga (una a la vez)
  k6-produccion:
    <<: *k6
    command: ["run", "--quiet", "-e", "BASE_URL=http://api-produccion:8080", "-e", "VUS=${VUS:-10}",
              "-e", "DURATION=${DURATION:-75s}", "--out", "json=/results/produccion.json", "/scripts/script.js"]
    depends_on:
      api-produccion: {condition: service_healthy}
  k6-version-a:
    <<: *k6
    command: ["run", "--quiet", "-e", "BASE_URL=http://api-version-a:8080", "-e", "VUS=${VUS:-10}",
              "-e", "DURATION=${DURATION:-75s}", "--out", "json=/results/version-a.json", "/scripts/script.js"]
    depends_on:
      api-version-a: {condition: service_healthy}
      k6-produccion: {condition: service_completed_successfully}
  k6-version-b:
    <<: *k6
    command: ["run", "--quiet", "-e", "BASE_URL=http://api-version-b:8080", "-e", "VUS=${VUS:-10}",
              "-e", "DURATION=${DURATION:-75s}", "--out", "json=/results/version-b.json", "/scripts/script.js"]
    depends_on:
      api-version-b: {condition: service_healthy}
      k6-version-a: {condition: service_completed_successfully}

  # ------------------------------------------------------------ quality gate
  gate:
    image: python:3.12-slim
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir --quiet --root-user-action=ignore
        "https://github.com/LeoR22/perf-quality-gate/archive/refs/tags/${PERF_GATE_REF:-v1}.zip"
        && python /demo/local/gate/run_local.py
    environment:
      PYTHONIOENCODING: utf-8
    volumes:
      - ./scripts:/demo/scripts:ro
      - ./local:/demo/local:ro
      - ./local/output/results:/results:ro
      - ./local/output/site:/site
    depends_on:
      k6-version-b: {condition: service_completed_successfully}

  # ------------------------------------------------------------ visualización
  reports:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8000", "--directory", "/site"]
    volumes:
      - ./local/output/site:/site:ro
    ports:
      - "8000:8000"

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin       # solo para la demo local
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/perf-gate.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./local/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - reports
