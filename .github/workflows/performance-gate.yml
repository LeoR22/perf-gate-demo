# Pipeline de un equipo que usa el Performance Quality Gate antes de desplegar.
# Esperado: version-a queda en ROJO y no se despliega; version-b pasa y se despliega.
name: Performance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a evaluar"
        type: choice
        options: [todas, version-a, version-b]
        default: todas

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # documentar el defecto cuando la versión no pasa
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((inputs.version == '' || inputs.version == 'todas') && '["version-a","version-b"]' || format('["{0}"]', inputs.version)) }}
    steps:
      - uses: actions/checkout@v7

      # Este workflow evalúa los resultados JMeter del kit (el veredicto oficial).
      # La prueba de carga real con k6 está en k6-load-test.yml.

      - name: Performance Quality Gate
        id: gate
        uses: LeoR22/perf-quality-gate@v1
        with:
          baseline: resultados/produccion-actual.csv
          candidate: resultados/${{ matrix.version }}.csv
          config: perf-gate.yml
          name: ${{ matrix.version }}
          create-issue: ${{ github.event_name != 'pull_request' }}   # en PRs solo se reporta

      - name: Desplegar a producción (simulado)
        # Solo llega aquí si el gate pasó: un gate en rojo detiene el job.
        run: |
          echo "🚀 ${{ matrix.version }} aprobada por el gate (${{ steps.gate.outputs.result }})."
          echo "Aquí iría el despliegue real."

  # Publica los reportes visuales en GitHub Pages,
  # pase o no pase el gate: el equipo necesita ver justamente qué falló.
  report:
    name: Publicar reporte
    needs: gate
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: perf-gate-report-*
          path: reports
      - name: Armar sitio
        run: python scripts/build_site.py reports site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Links
        run: |
          {
            echo "### 📊 Reportes publicados"
            echo "- Portada: ${{ steps.deploy.outputs.page_url }}"
            echo "- Versión A: ${{ steps.deploy.outputs.page_url }}version-a/report.html"
            echo "- Versión B: ${{ steps.deploy.outputs.page_url }}version-b/report.html"
          } >> "$GITHUB_STEP_SUMMARY"
