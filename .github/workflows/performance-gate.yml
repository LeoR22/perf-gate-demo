# Pipeline de un equipo que usa el Performance Quality Gate antes de desplegar.
#
# Evalúa AUTOMÁTICAMENTE cada archivo de resultados/ contra producción:
#   resultados/produccion-actual.csv  → línea base (producción)
#   resultados/<cualquier-otro>.csv   → una versión candidata (también acepta .json de k6)
# Para evaluar una versión nueva basta con subir su archivo a resultados/ y hacer push.
# Esperado con los datos del reto: version-a en ROJO (no se despliega) y version-b en VERDE.
name: Performance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Archivo a evaluar, sin extensión (p. ej. version-a). Vacío = todos"
        required: false
        default: ""

permissions:
  contents: read

env:
  BASELINE: resultados/produccion-actual.csv

jobs:
  # Descubre las versiones a evaluar a partir de los archivos de resultados/.
  descubrir:
    name: Descubrir versiones
    runs-on: ubuntu-latest
    outputs:
      versiones: ${{ steps.lista.outputs.versiones }}
    steps:
      - uses: actions/checkout@v7
      - id: lista
        env:
          FILTRO: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          base = pathlib.Path(os.environ["BASELINE"])
          filtro = os.environ.get("FILTRO", "").strip()
          archivos = sorted(p for p in pathlib.Path("resultados").iterdir()
                            if p.suffix.lower() in (".csv", ".json") and p != base)
          versiones = [{"name": p.stem, "file": str(p)} for p in archivos
                       if not filtro or p.stem == filtro]
          print("versiones=" + json.dumps(versiones))
          PY
          echo "### Versiones a evaluar contra \`$BASELINE\`" >> "$GITHUB_STEP_SUMMARY"
          grep '^versiones=' "$GITHUB_OUTPUT" | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: ${{ matrix.name }}
    needs: descubrir
    if: needs.descubrir.outputs.versiones != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # documentar el defecto cuando la versión no pasa
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.descubrir.outputs.versiones) }}
    steps:
      - uses: actions/checkout@v7

      - name: Performance Quality Gate
        id: gate
        uses: LeoR22/perf-quality-gate@v1
        with:
          baseline: ${{ env.BASELINE }}
          candidate: ${{ matrix.file }}
          config: perf-gate.yml
          name: ${{ matrix.name }}
          create-issue: ${{ github.event_name != 'pull_request' }}   # en PRs solo se reporta

      - name: Desplegar a producción (simulado)
        # Solo llega aquí si el gate pasó: un gate en rojo detiene el job.
        run: |
          echo "🚀 ${{ matrix.name }} aprobada por el gate (${{ steps.gate.outputs.result }})."
          echo "Aquí iría el despliegue real."

  # Publica los reportes visuales en GitHub Pages,
  # pase o no pase el gate: el equipo necesita ver justamente qué falló.
  report:
    name: Publicar reporte
    needs: gate
    if: always() && needs.gate.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: perf-gate-report-*
          path: reports
      - name: Armar sitio
        run: python scripts/build_site.py reports site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Links
        run: |
          {
            echo "### 📊 Reportes publicados"
            echo "- Portada: ${{ steps.deploy.outputs.page_url }}"
            for d in site/*/; do n=$(basename "$d"); echo "- $n: ${{ steps.deploy.outputs.page_url }}$n/report.html"; done
          } >> "$GITHUB_STEP_SUMMARY"
